<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Files &middot; Vault</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;650&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="vendor/hosanna/styles.css" />
    <link rel="stylesheet" href="css/vault.css" />
  </head>
  <body>
    <header class="pv-appbar">
      <a class="pv-brand" href="vault.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5 19.5 5.4v5.9c0 4.7-3.2 8.4-7.5 10.2-4.3-1.8-7.5-5.5-7.5-10.2V5.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="10.4" r="1.9" stroke="currentColor" stroke-width="1.6"/><path d="M12 12.3v2.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Vault
      </a>
      <span class="pv-spacer"></span>
      <span class="pv-who" id="who"></span>
      <button class="hos-button" type="button" data-variant="ghost" data-size="sm" data-hos-focus id="signout">
        <span class="hos-button__label">Sign out</span>
      </button>
    </header>

    <main class="pv-main">
      <div class="pv-head">
        <h1>Files</h1>
        <span class="pv-count tnum" id="count"></span>
      </div>

      <div class="pv-state" id="state">Loading your files…</div>
      <div class="pv-list" id="list" hidden></div>
    </main>

    <div class="pv-toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="js/pages/vault.js"></script>
  </body>
</html>
