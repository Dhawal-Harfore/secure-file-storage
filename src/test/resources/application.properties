spring.datasource.url=jdbc:h2:mem:secure_file_storage_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

server.forward-headers-strategy=native
server.servlet.session.timeout=12h
server.servlet.session.cookie.name=vault_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

vault.public-url=https://thecollege.cloud
vault.mail.from=Vault <signin@thecollege.cloud>
vault.mail.resend-key=
vault.mail.resend-url=https://api.resend.com/emails
vault.storage.root=target/test-storage
vault.storage.chunk-size=8MB
vault.storage.max-upload-size=2GB
vault.storage.max-active-uploads=4
vault.storage.upload-ttl=24h
vault.storage.free-space-reserve=2GB
vault.renditions.ffmpeg=ffmpeg
vault.renditions.ghostscript=gs
vault.renditions.nice=15
vault.renditions.video-timeout=45m
vault.renditions.document-timeout=10m

