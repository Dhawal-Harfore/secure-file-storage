<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sign in to Vault</title>
</head>
<body style="margin:0;padding:0;background:#f3f3ef;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f3ef;">
<tr>
<td align="center" style="padding:48px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e6e5de;border-radius:6px;">
<tr>
<td style="padding:32px;font-family:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#17170f;">
<p style="margin:0 0 24px;font-size:13px;line-height:20px;font-weight:600;color:#54544c;">Vault</p>
<h1 style="margin:0 0 8px;font-size:20px;line-height:28px;font-weight:600;color:#17170f;">Sign in to Vault</h1>
<p style="margin:0 0 24px;font-size:14px;line-height:20px;color:#54544c;">This link signs you in once and stops working after {{minutes}} minutes.</p>
<table role="presentation" cellpadding="0" cellspacing="0">
<tr>
<td style="border-radius:4px;background:#0284c7;">
<a href="{{link}}" style="display:inline-block;padding:10px 16px;font-size:14px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:4px;">Sign in</a>
</td>
</tr>
</table>
<p style="margin:24px 0 4px;font-size:13px;line-height:20px;color:#54544c;">Or paste this into your browser:</p>
<p style="margin:0;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:16px;color:#0369a1;word-break:break-all;">{{link}}</p>
<hr style="margin:32px 0 16px;border:0;border-top:1px solid #efeee8;">
<p style="margin:0;font-size:12px;line-height:16px;color:#8a8a80;">If you didn't ask to sign in, you can ignore this email. Nobody can get in without the link.</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
