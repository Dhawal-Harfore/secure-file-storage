<!doctype html>
<html lang="en" data-theme="dark" data-hos-canvas="black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unlocking &middot; Vault</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;650&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="vendor/hosanna/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="pv-auth" id="fallback" hidden>
      <div class="pv-auth-card">
        <span class="pv-auth-mark" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M12 2.5 19.5 5.4v5.9c0 4.7-3.2 8.4-7.5 10.2-4.3-1.8-7.5-5.5-7.5-10.2V5.4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="m9 11.5 2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <h1 id="fallback-title">This link didn't work</h1>
        <p class="pv-auth-sub" id="fallback-text"></p>
        <a class="hos-button" data-variant="primary" data-size="lg" data-hos-focus href="login.html">
          <span class="hos-button__label">Request a new link</span>
        </a>
      </div>
    </main>

    <div class="veil-root" id="veil" data-phase="verifying" role="status" aria-live="polite">
      <div class="veil-chrome">
        <div class="veil-panel" id="panel">
          <svg class="hos-spinner" data-size="lg" width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle class="hos-spinner__track" cx="12" cy="12" r="9" stroke-width="2.5" />
            <circle class="hos-spinner__indicator" cx="12" cy="12" r="9" stroke-width="2.5" />
          </svg>
          <h1 class="veil-title" id="veil-title">Unlocking your vault</h1>
          <p class="veil-sub" id="veil-sub">Verifying your sign-in link. This only takes a moment.</p>
        </div>
      </div>

      <svg class="veil-hand" id="hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <g id="hand-open">
          <path d="M18 11V6a2 2 0 0 0-4 0" />
          <path d="M14 10V4a2 2 0 0 0-4 0v2" />
          <path d="M10 10.5V6a2 2 0 0 0-4 0v8" />
          <path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
        </g>
        <g id="hand-grab" hidden>
          <path d="M18 11.5V9a2 2 0 0 0-4 0v1.4" />
          <path d="M14 10V8a2 2 0 0 0-4 0v2" />
          <path d="M10 9.9V9a2 2 0 0 0-4 0v5" />
          <path d="M6 14a2 2 0 0 0-4 0a8 8 0 0 0 8 8h4a8 8 0 0 0 8-8v-1" />
        </g>
      </svg>
    </div>

    <script type="module" src="js/pages/unlock.js"></script>
  </body>
</html>
