<!doctype html>
<html lang="en" data-theme="dark" data-hos-canvas="black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in &middot; Vault</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;650&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="vendor/hosanna/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <header class="pv-topbar">
      <a class="pv-brand" href="index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5 19.5 5.4v5.9c0 4.7-3.2 8.4-7.5 10.2-4.3-1.8-7.5-5.5-7.5-10.2V5.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="10.4" r="1.9" stroke="currentColor" stroke-width="1.6"/><path d="M12 12.3v2.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> Vault</a>
    </header>

    <main class="pv-auth">
      <div class="pv-auth-card" data-step="request">
        <span class="pv-auth-mark" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M12 2.5 19.5 5.4v5.9c0 4.7-3.2 8.4-7.5 10.2-4.3-1.8-7.5-5.5-7.5-10.2V5.4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="12" cy="10.4" r="1.9" stroke="currentColor" stroke-width="1.3"/><path d="M12 12.3v2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>

        <h1>Sign in</h1>
        <p class="pv-auth-sub">
          We email you a single-use link that expires in 15 minutes. There is no password.
        </p>

        <p class="pv-auth-error" id="error" hidden></p>

        <form class="pv-auth-form" id="request-form" novalidate>
          <label class="hos-label" for="email">Email address</label>
          <input
            class="hos-input"
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            required
            placeholder="you@vit.ac.in"
            data-hos-focus
          />
          <button class="hos-button" type="submit" data-variant="primary" data-size="lg" data-hos-focus id="submit">
            <span class="hos-button__label">Send me a link</span>
          </button>
        </form>

        <p class="pv-auth-note">Your files stay encrypted at rest whether you are signed in or not.</p>
      </div>

      <div class="pv-auth-card" data-step="sent" hidden>
        <span class="pv-auth-mark" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><rect x="3" y="5.5" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.3"/><path d="m3.8 7 7.3 5.4a1.5 1.5 0 0 0 1.8 0L20.2 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>

        <h1>Check your email</h1>
        <p class="pv-auth-sub">
          A sign-in link is on its way to <strong id="sent-to"></strong>. It works once and expires in 15 minutes.
        </p>

        <div class="pv-devlink" id="devlink" hidden></div>

        <button class="hos-button" type="button" data-variant="ghost" data-hos-focus id="restart">
          <span class="hos-button__label">Use a different address</span>
        </button>
      </div>
    </main>

    <script type="module" src="js/pages/login.js"></script>
  </body>
</html>
