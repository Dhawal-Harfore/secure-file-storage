spring.application.name=secure-file-storage

server.forward-headers-strategy=native
server.servlet.session.timeout=12h
server.servlet.session.cookie.name=vault_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

vault.public-url=${VAULT_PUBLIC_URL:https://thecollege.cloud}
vault.mail.from=${VAULT_MAIL_FROM:Vault <signin@thecollege.cloud>}
vault.mail.resend-key=${RESEND_API_KEY:}
vault.mail.resend-url=https://api.resend.com/emails

vault.storage.root=${VAULT_STORAGE_ROOT:/var/lib/vault}
vault.storage.chunk-size=8MB
vault.storage.max-upload-size=2GB
vault.storage.max-active-uploads=4
vault.storage.upload-ttl=24h
vault.storage.free-space-reserve=2GB

vault.renditions.ffmpeg=ffmpeg
vault.renditions.ghostscript=gs
vault.renditions.nice=15
vault.renditions.video-timeout=45m
vault.renditions.document-timeout=10m
